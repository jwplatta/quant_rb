services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  sidekiq:
    build: .
    command: bundle exec sidekiq -r ./lib/options_trader.rb
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RACK_ENV: production
      SCHWAB_TOKEN_PATH: /app/.schwab_rb/token.json
    volumes:
      - .:/app
      - /Users/jplatta/.schwab_rb/token.json:/app/.schwab_rb/token.json
      - /Users/jplatta/.schwab_rb/account_names.json:/app/.schwab_rb/account_names.json
      - /Users/jplatta/.schwab_rb/account_hashes.json:/app/.schwab_rb/account_hashes.json
    restart: unless-stopped

  clockwork:
    build: .
    env_file:
      - .env
    command: bundle exec clockwork bin/spx_opt_chain_download_job.rb
    depends_on:
      - redis
      - sidekiq
    environment:
      REDIS_URL: redis://redis:6379/0
      RACK_ENV: production
      SCHWAB_TOKEN_PATH: /app/.schwab_rb/token.json
    volumes:
      - .:/app
      - /Users/jplatta/.schwab_rb/token.json:/app/.schwab_rb/token.json
      - /Users/jplatta/.schwab_rb/account_names.json:/app/.schwab_rb/account_names.json
      - /Users/jplatta/.schwab_rb/account_hashes.json:/app/.schwab_rb/account_hashes.json
    restart: unless-stopped

  spx_1dte_bot:
    build:
      context: .
      dockerfile: bots/Dockerfile
    env_file:
      - .env
      - bots/.env
    environment:
      SCHWAB_TOKEN_PATH: /app/.schwab_rb/token.json
      SCHWAB_HOME: /app/.schwab_rb
      TZ: America/Chicago
    volumes:
      - .:/app
      - /Users/jplatta/.schwab_rb/token.json:/app/.schwab_rb/token.json
      - /Users/jplatta/.schwab_rb/account_names.json:/app/.schwab_rb/account_names.json
      - /Users/jplatta/.schwab_rb/account_hashes.json:/app/.schwab_rb/account_hashes.json
      - /Users/jplatta/.options_trader/bots/spx_1dte_bot.log:/app/logs/spx_1dte_bot.log
      - /Users/jplatta/.options_trader/trades/spx_1dte_trades.json:/app/trades/spx_1dte_trades.json
    restart: unless-stopped