# SPX 1DTE Bot Configuration
# Trading High Risk Dates Configuration
# Bot will not open new positions with an expiration on these dates
# Format: YYYY-MM-DD

trade_mode: "paper"  # Options: "paper", "live"
account_name: "TRADING_ACCOUNT"
trade:
  underlying_symbol: "$SPX"
  option_root: "SPXW"
  spread_width: 20
  min_credit: 1.1
  max_credit: 1.45
  target_delta: 0.7
  credit_balance_ratio: 0.6
  delta_ratio: 0.6
  max_total_delta: 0.16
  max_call_delta: 0.07
  min_call_delta: 0.02
  max_put_delta: 0.1
  min_put_delta: 0.02
  quantity: 1
  price_increment: 0.05
  max_search_attempts: 20
  max_tweak_attempts: 100
  green_delta: 0.15
  yellow_delta: 0.25
  red_delta: 0.3
  exit_loss_mult: 4.0
  exit_prof_price: 0.5
  est_fees_per_contract: 1.92
  est_commission_per_contract: 2.6

enter_trade_window:
  default:
    start_time: "02:55 PM"
    end_time: "03:15 PM"
    timezone: "America/Chicago"
  early_close:
    start_time: "11:55 AM"
    end_time: "12:15 PM"
    timezone: "America/Chicago"

monitoring_window:
  default:
    start_time: "08:30 AM"
    end_time: "03:15 PM"
    exit_by_time: "12:00 PM"
    timezone: "America/Chicago"
  early_close:
    start_time: "08:30 AM"
    end_time: "12:15 PM"
    exit_by_time: "11:00 AM"
    timezone: "America/Chicago"

